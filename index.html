    this.renderSheet();
    this.toast('Saved.');
  },
  saveInventory(bucket, idx) {
    const c = this.active();
    if (!c.inventory || !c.inventory[bucket] || !c.inventory[bucket][idx]) return;
    const get = id => { const el = document.getElementById(id); return el ? el.value : ''; };
    const toNum = v => { if (v === '' || v == null) return undefined; const n = +v; return isNaN(n) ? v : n; };
    const it = { ...c.inventory[bucket][idx] };
    it.name = get('ed-name').trim();
    it.category = get('ed-category').trim();
    it.subcategory = get('ed-subcategory').trim();
    it.notes = get('ed-notes').trim();
    const dur = toNum(get('ed-durability').trim());
    const qty = toNum(get('ed-qty').trim());
    if (dur !== undefined) it.durability = dur; else delete it.durability;
    if (qty !== undefined) it.qty = qty; else delete it.qty;
    if (bucket === 'weapons') {
      it.damage = get('ed-damage').trim();
      it.range = get('ed-range').trim();
    }
    if (bucket === 'armor') {
      const ac = toNum(get('ed-ac').trim());
      if (ac !== undefined) it.ac = ac; else delete it.ac;
    }
    c.inventory[bucket][idx] = it;
    this._editing = null;
    this.save();
    this.renderSheet();
    this.toast('Saved.');
  },
  renderInitPool(c) {
    const cs = this.computedStats(c);
    const count = cs.initiative || 0;
    const dieSize = cs.initiativeDie || 'd6';
    const pool = (c.vitals && c.vitals.initiativePool) || null;
    const spentCount = pool ? pool.filter(d => d.spent).length : 0;
    const summary = pool
      ? `${pool.length - spentCount}/${pool.length} unspent${pool.length ? ` · sum ${pool.filter(d => !d.spent).reduce((a,d) => a + d.value, 0)}` : ''}`
      : `No roll yet`;
    let diceHtml = '';
    let addBtnHtml = '';
    if (pool && pool.length) {
      diceHtml = pool.map((d, i) => this.renderInitDie(d, i)).join('');
      addBtnHtml = `<button class="init-die-add" onclick="app.addInitDie()" title="Roll one extra ${dieSize} (spell/ability bonus)">+</button>`;
    }
    return `<div class="init-pool-wrap">
      <div class="init-pool-row">
        <button class="init-roll-btn" onclick="app.rollInitiative()" title="Roll ${count} ${dieSize}">${pool ? '↻' : 'Roll'} ${count}${dieSize}</button>
        ${diceHtml}
        ${addBtnHtml}
      </div>
      <div class="init-pool-summary">${summary}</div>
    </div>`;
  },
  renderInitDie(d, i) {
    const v = d.value;
    const cls = 'init-die' + (d.spent ? ' spent' : '');
    // Pip layout for 1-6; for non-6-sided we fall back to a number
    const pipMap = {
      1: [5],
      2: [1, 9],
      3: [1, 5, 9],
      4: [1, 3, 7, 9],
      5: [1, 3, 5, 7, 9],
      6: [1, 3, 4, 6, 7, 9]
    };
    let inner;
    if (pipMap[v]) {
      const cells = [];
      for (let idx = 1; idx <= 9; idx++) {
        cells.push(pipMap[v].includes(idx) ? `<span class="pip"></span>` : `<span></span>`);
      }
      inner = `<div class="pips">${cells.join('')}</div>`;
    } else {
      inner = `<div class="num-fallback">${v}</div>`;
    }
    const xBadge = `<span class="init-die-x" onclick="event.stopPropagation(); app.deleteInitDie(${i})" title="Delete this die">×</span>`;
    return `<div class="${cls}" data-idx="${i}" onclick="app.toggleInitDie(${i})" title="${d.spent ? 'Spent — tap to restore' : 'Tap to spend'}: ${v}">${inner}${xBadge}</div>`;
  },
  rollInitiative() {
    const c = this.active();
    c.vitals = c.vitals || {};
    const cs = this.computedStats(c);
    const count = cs.initiative || 0;
    const dieSize = cs.initiativeDie || 'd6';
    const sides = DICE.parseDie(dieSize) || 6;
    const pool = [];
    for (let i = 0; i < count; i++) {
      pool.push({ value: DICE.rollDie(sides), spent: false });
    }
    c.vitals.initiativePool = pool;
    this.save();
    this.renderSheet();
    const sum = pool.reduce((a,d) => a + d.value, 0);
    this.toast(`Rolled ${count}${dieSize}: ${pool.map(d => d.value).join(', ')} (sum ${sum})`);
  },
  toggleInitDie(idx) {
    const c = this.active();
    const pool = c.vitals && c.vitals.initiativePool;
    if (!pool || !pool[idx]) return;
    pool[idx].spent = !pool[idx].spent;
    this.save();
    this.renderSheet();
  },
  deleteInitDie(idx) {
    const c = this.active();
    const pool = c.vitals && c.vitals.initiativePool;
    if (!pool || !pool[idx]) return;
    const removed = pool[idx];
    pool.splice(idx, 1);
    this.save();
    this.renderSheet();
    this.toast(`Removed ${removed.bonus ? 'bonus ' : ''}die (${removed.value})`);
  },
  addInitDie() {
    const c = this.active();
    c.vitals = c.vitals || {};
    if (!c.vitals.initiativePool) c.vitals.initiativePool = [];
    const cs = this.computedStats(c);
    const dieSize = cs.initiativeDie || 'd6';
    const sides = DICE.parseDie(dieSize) || 6;
    const v = DICE.rollDie(sides);
    c.vitals.initiativePool.push({ value: v, spent: false, bonus: true });
    this.save();
    this.renderSheet();
    this.toast(`Rolled bonus ${dieSize}: ${v}`);
  },
  editMonies(ev) {
    const c = this.active();
    c.inventory = c.inventory || {};
    const current = c.inventory.monies ?? c.inventory.monnies ?? 0;
    const host = ev && ev.currentTarget ? ev.currentTarget : null;
    if (!host) return;
    host.innerHTML = `Monies: <input type="number" class="inline-edit-input" style="width:80px;" value="${current}" id="monies-input">`;
    host.onclick = null;
    const input = document.getElementById('monies-input');
    if (!input) return;
    input.focus(); input.select();
    const commit = () => {
      const val = input.value.trim();
      const n = val === '' ? 0 : +val;
      c.inventory.monies = isNaN(n) ? 0 : n;
      if (c.inventory.monnies != null) delete c.inventory.monnies;
      this.save();
      this.renderSheet();
    };
    const cancel = () => this.renderSheet();
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    });
    input.addEventListener('blur', commit);
  },
  toggleEquip(bucket, idx) {
    const c = this.active();
    const arr = c.inventory?.[bucket];
    if (!arr || !arr[idx]) return;
    const it = arr[idx];
    it.equipped = !it.equipped;
    this.save();
    this.renderSheet();
    const effects = this.effectsFor(it);
    if (it.equipped && effects.length) {
      const summary = effects.map(e =>
        e.stat === 'initiativeDie' ? `Init Die -> ${e.value}` :
        `${e.op}${e.value} ${e.stat}`
      ).join(', ');
      this.toast(`Equipped ${it.name}: ${summary}`);
    } else if (it.equipped) {
      this.toast(`Equipped ${it.name}.`);
    } else {
      this.toast(`Unequipped ${it.name}.`);
    }
  },

  // ---------- long rest ----------
  confirmLongRest() {
    const c = this.active();
    const lostCount = c.vitals.healthDice.filter(d => d.lost).length;
    const reserveDeficit = ['physical','intellectual','emotional','magic']
      .map(t => {
        const r = c.skills[t]?.reserve;
        return r ? (r.max - r.current) : 0;
      }).reduce((a,b)=>a+b, 0);

    this.showModal({
      title: '🌙 Long Rest',
      body: `This will:<br>
        · Restore ${lostCount} lost Hit Die${lostCount === 1 ? '' : 's'}<br>
        · Refill ${reserveDeficit} reserve die${reserveDeficit === 1 ? '' : 's'} across all trees<br>
        · Burn <strong>1d6 − 2</strong> (min 0) from your COAL (current: ${c.vitals.coal.current})<br>
        ${c.vitals.wounds.minor > 0 ? `· Advance wound recovery (${c.vitals.wounds.restsUntilMinorHeals} → ${c.vitals.wounds.restsUntilMinorHeals - 1} rests)` : '· No wounds to recover'}`,
      actions: [
        { label: 'Cancel', class: '', fn: () => this.closeModal() },
        { label: 'Confirm Rest', class: 'primary', fn: () => this.longRest() }
      ]
    });
  },
  longRest() {
    const c = this.active();
    for (const die of c.vitals.healthDice) die.lost = false;
    for (const tree of ['physical','intellectual','emotional','magic']) {
      const r = c.skills[tree]?.reserve;
      if (r) r.current = r.max;
    }
    // COAL burn: roll 1d6-2 (min 0), subtract from current COAL (clamped at 0).
    const coalRoll = DICE.rollDie(6);
    const coalBurn = Math.max(0, coalRoll - 2);
    const beforeCoal = c.vitals.coal.current;
    c.vitals.coal.current = Math.max(0, beforeCoal - coalBurn);
    const actualBurn = beforeCoal - c.vitals.coal.current;
    this.pushHistory({
      label: 'Long Rest COAL burn (1d6−2)',
      total: coalBurn,
      detail: `rolled ${coalRoll} → burned ${actualBurn}`
    });
    if (c.vitals.wounds.minor > 0) {
      c.vitals.wounds.restsUntilMinorHeals -= 1;
      if (c.vitals.wounds.restsUntilMinorHeals <= 0) {
        c.vitals.wounds.minor -= 1;
        c.vitals.wounds.restsUntilMinorHeals = 5;
      }
    }
    this.save();
    this.closeModal();
    this.renderSheet();
    this.toast(`Rested. COAL burn: rolled ${coalRoll} − 2 = ${coalBurn} (lost ${actualBurn}).`);
  },

  // ---------- skill rolls ----------
  rollSkill(treeId, skillKey) {
    const c = this.active();
    const tree = c.skills[treeId];
    const skill = tree[skillKey];
    if (!skill) return;
    const baseDie = skill.die;
    const skillName = skillKey.charAt(0).toUpperCase() + skillKey.slice(1);

    this.showModal({
      title: `Roll ${skillName}`,
      body: `Base die: <strong>${baseDie}</strong><br>
        Reserve pool: ${tree.reserve.current}/${tree.reserve.max} × ${tree.reserve.die}<br><br>
        Spend reserve dice? <input type="number" id="roll-reserve-spend" min="0" max="${tree.reserve.current}" value="0" style="width:60px; background:var(--bg-elev); border:1px solid var(--border); color:var(--text); padding:6px; border-radius:6px;">`,
      actions: [
        { label: 'Cancel', class: '', fn: () => this.closeModal() },
        { label: 'Roll', class: 'primary', fn: () => {
          const spend = parseInt(document.getElementById('roll-reserve-spend').value || '0', 10);
          this.executeSkillRoll(treeId, skillKey, spend);
        }}
      ]
    });
  },
  executeSkillRoll(treeId, skillKey, reserveSpend) {
    const c = this.active();
    const tree = c.skills[treeId];
    const skill = tree[skillKey];
    const skillName = skillKey.charAt(0).toUpperCase() + skillKey.slice(1);
    reserveSpend = Math.min(reserveSpend, tree.reserve.current);
    const baseRoll = DICE.roll(skill.die).result;
    const reserveRolls = [];
    for (let i = 0; i < reserveSpend; i++) reserveRolls.push(DICE.roll(tree.reserve.die).result);
    const total = baseRoll + reserveRolls.reduce((a,b)=>a+b, 0);
    // Parse bonus like "+1 (Potential)" or "+2" — extract first number
    const bonusMatch = /([+-]\d+)/.exec(skill.bonus || '');
    const bonus = bonusMatch ? parseInt(bonusMatch[1], 10) : 0;
    const grandTotal = total + bonus;
    tree.reserve.current -= reserveSpend;
    this.save();
    const breakdown = `${skill.die}→${baseRoll}${reserveRolls.length ? ' · reserve ' + reserveRolls.map(r=>`${tree.reserve.die}→${r}`).join(' · ') : ''}${bonus ? ` · bonus ${bonus >= 0 ? '+' : ''}${bonus}` : ''}`;
    this.pushHistory({ label: skillName, total: grandTotal, detail: breakdown });

    this.showModal({
      title: `${skillName}: ${grandTotal}`,
      body: `<div class="roll-display">
        <div class="big">${grandTotal}</div>
        <div class="sub">${breakdown}</div>
      </div>`,
      actions: [
        { label: 'Close', class: 'primary', fn: () => { this.closeModal(); this.renderSheet(); } }
      ]
    });
  },

  // ---------- dice roller screen ----------
  renderDice() {
    const el = document.getElementById('screen-dice');
    const last = this.rollHistory[0];
    const lastHtml = last
      ? `<div class="roll-result">
          <div class="vital-label">${this.escape(last.label)}</div>
          <div class="total">${last.total}</div>
          <div class="breakdown">${this.escape(last.detail)}</div>
        </div>`
      : `<div class="hint" style="margin-bottom:14px;">No rolls yet this session.</div>`;

    const histHtml = this.rollHistory.slice(0, 15).map(h =>
      `<div class="history-item"><span class="label">${this.escape(h.label)}</span><span>${this.escape(h.detail)} · <strong>${h.total}</strong></span></div>`
    ).join('');

    el.innerHTML = `
      <h1 style="margin-bottom:16px;">Dice Roller</h1>
      ${lastHtml}
      <h3 style="margin-bottom:8px;">Quick dice</h3>
      <div class="dice-pad">
        ${['d4','d6','d8','d10','d12','d20'].map(d =>
          `<button onclick="app.quickRoll('${d}')">${d}</button>`
        ).join('')}
      </div>
      <h3 style="margin-bottom:8px;">Custom roll</h3>
      <div class="custom-roll">
        <input type="number" id="cr-count" value="2" min="1" max="20"> ×
        <select id="cr-die">
          <option>d4</option><option>d6</option><option selected>d8</option>
          <option>d10</option><option>d12</option><option>d20</option><option>d100</option>
        </select>
        + <input type="number" id="cr-mod" value="0">
        <button class="btn primary" style="flex:0 0 auto;max-width:120px;" onclick="app.customRoll()">Roll</button>
      </div>
      <h3 style="margin: 20px 0 8px;">History (this session)</h3>
      ${histHtml || '<div class="hint">Empty.</div>'}
      <button class="btn" style="margin-top:16px; max-width:180px;" onclick="app.clearHistory()">Clear history</button>
    `;
  },
  quickRoll(dieStr) {
    const { result } = DICE.roll(dieStr);
    this.pushHistory({ label: `Quick ${dieStr}`, total: result, detail: `${dieStr}→${result}` });
    this.renderDice();
  },
  customRoll() {
    const count = parseInt(document.getElementById('cr-count').value || '1', 10);
    const die = document.getElementById('cr-die').value;
    const mod = parseInt(document.getElementById('cr-mod').value || '0', 10);
    const expr = `${count}${die}${mod >= 0 ? '+' : ''}${mod || ''}`.replace(/\+0$|-0$/,'');
    const res = DICE.rollExpression(`${count}${die}${mod >= 0 ? '+' : ''}${mod}`);
    if (!res) return;
    this.pushHistory({ label: `Custom`, total: res.total, detail: `${res.rolls.join(', ')}${mod ? ` ${mod >= 0 ? '+' : ''}${mod}` : ''} → ${res.total}` });
    this.renderDice();
  },
  pushHistory(entry) {
    this.rollHistory.unshift({ ...entry, time: Date.now() });
    if (this.rollHistory.length > 50) this.rollHistory.length = 50;
  },
  clearHistory() { this.rollHistory = []; this.renderDice(); },

  // ---------- rules browser ----------
  renderRules() {
    const el = document.getElementById('screen-rules');
    const tabs = [
      { id:'abilities',   label:'Abilities' },
      { id:'races',       label:'Races' },
      { id:'jobs',        label:'Jobs' },
      { id:'origins',     label:'Origins' },
      { id:'equipment',   label:'Equipment' },
      { id:'basicActions',label:'Basic Actions' },
      { id:'keywords',    label:'Keywords' }
    ];
    const tabBar = tabs.map(t =>
      `<button class="${this.filters.rulesTab === t.id ? 'active' : ''}" onclick="app.setRulesTab('${t.id}')">${t.label}</button>`
    ).join('');

    const showColors = ['abilities','origins','jobs'].includes(this.filters.rulesTab);
    const showTier   = this.filters.rulesTab === 'abilities';
    const colorFilter = showColors ? `
      <div class="color-filters">
        ${['RED','BLUE','GREEN','PURPLE'].map(col =>
          `<div class="color-filter ${col.toLowerCase()} ${this.filters.colors.has(col) ? 'active' : ''}" onclick="app.toggleColor('${col}')" title="${RULEBOOK.colorPillars[col] || col}"></div>`
        ).join('')}
      </div>` : '';
    const tierFilter = showTier ? `
      <select class="search-input" style="flex:0 0 120px;" onchange="app.filters.tier=this.value; app.renderRules()">
        <option value="all">All tiers</option>
        <option value="1" ${this.filters.tier==='1'?'selected':''}>Tier 1</option>
        <option value="2" ${this.filters.tier==='2'?'selected':''}>Tier 2</option>
        <option value="3" ${this.filters.tier==='3'?'selected':''}>Tier 3</option>
      </select>` : '';

    const content = this.renderRulesList();

    el.innerHTML = `
      <h1 style="margin-bottom:16px;">Rules</h1>
      <div class="tab-bar">${tabBar}</div>
      <div class="filter-bar">
        <input class="search-input" placeholder="Search…" value="${this.escape(this.filters.search)}" oninput="app.filters.search=this.value; app.renderRulesList(true)">
        ${colorFilter}${tierFilter}
      </div>
      <div id="rules-list-container">${content}</div>
    `;
  },
  setRulesTab(id) {
    this.filters.rulesTab = id;
    this.filters.search = '';
    this.filters.tier = 'all';
    this.renderRules();
  },
  toggleColor(col) {
    if (this.filters.colors.has(col)) this.filters.colors.delete(col);
    else this.filters.colors.add(col);
    this.renderRules();
  },
  renderRulesList(onlyContainer = false) {
    const tab = this.filters.rulesTab;
    let items = RULEBOOK[tab] || [];
    const q = this.filters.search.toLowerCase().trim();

    const matchQ = (s) => !q || (s && String(s).toLowerCase().includes(q));

    items = items.filter(it => {
      if (q) {
        const searchable = [it.name, it.term, it.description, it.definition, it.feature].filter(Boolean).join(' ').toLowerCase();
        if (!searchable.includes(q)) return false;
      }
      if (tab === 'abilities') {
        if (this.filters.tier !== 'all' && String(it.tier) !== this.filters.tier) return false;
        if (it.colors && it.colors.length) {
          if (!it.colors.some(c => this.filters.colors.has(c))) return false;
        }
      }
      if (tab === 'origins' && it.colors && it.colors.length) {
        if (!it.colors.some(c => this.filters.colors.has(c))) return false;
      }
      if (tab === 'jobs' && it.color) {
        if (!this.filters.colors.has(it.color)) return false;
      }
      return true;
    });

    const renderers = {
      abilities:    this.renderAbilityItem,
      races:        this.renderRaceItem,
      jobs:         this.renderJobItem,
      origins:      this.renderOriginItem,
      equipment:    this.renderEquipmentItem,
      basicActions: this.renderBasicActionItem,
      keywords:     this.renderKeywordItem
    };
    const r = renderers[tab] ? renderers[tab].bind(this) : () => '';
    const html = `<div class="item-list">${items.map(r).join('') || '<div class="hint">No results.</div>'}</div>`;
    if (onlyContainer) {
      const c = document.getElementById('rules-list-container');
      if (c) c.innerHTML = html;
    }
    return html;
  },
  renderAbilityItem(a) {
    const chip = this.colorChip(a.colors || []);
    const tier = a.tier ? `<span class="chip tier">Tier ${a.tier}</span>` : '';
    return `<div class="item">
      <div class="item-name">${chip}<strong>${this.escape(a.name)}</strong>${tier}</div>
      ${a.description ? `<div class="item-desc">${this.escape(a.description)}</div>` : ''}
    </div>`;
  },
  renderRaceItem(r) {
    const traits = (r.traits || []).map(t => `<li><strong>${this.escape(t.name)}</strong>${t.description ? ': ' + this.escape(t.description) : ''}</li>`).join('');
    const wip = r.status === 'wip' ? `<span class="chip tier" style="color:#d49c5a">WIP</span>` : '';
    return `<div class="item">
      <div class="item-name"><strong>${this.escape(r.name)}</strong>${wip}</div>
      ${r.description ? `<div class="item-desc">${this.escape(r.description)}</div>` : ''}
      ${traits ? `<ul style="margin:6px 0 0 20px; font-size:13px; color:var(--text-dim);">${traits}</ul>` : ''}
    </div>`;
  },
  renderJobItem(j) {
    const chip = this.colorChip([j.color]);
    const levels = (j.levelTable || []).slice(0, 10).map(l =>
      `<div style="display:flex; gap:12px; padding:4px 0; font-size:13px; border-bottom:1px solid var(--border);">
        <span style="width:60px; color:var(--text-dim);">Lvl ${l.level}</span>
        ${l.healthDie ? `<span>HD ${l.healthDie}</span>` : ''}
        ${l.initiative ? `<span>Init ${l.initiative}</span>` : ''}
        ${l.grants && l.grants.length ? `<span style="flex:1; color:var(--text-dim);">${l.grants.map(g=>this.escape(g)).join(' · ')}</span>` : ''}
      </div>`
    ).join('');
    return `<div class="item">
      <div class="item-name">${chip}<strong>${this.escape(j.name)}</strong>${j.classAttribute ? `<span class="chip tier">${this.escape(j.classAttribute)}</span>` : ''}</div>
      ${j.description ? `<div class="item-desc">${this.escape(j.description)}</div>` : ''}
      ${levels ? `<div style="margin-top:8px;">${levels}</div>` : ''}
    </div>`;
  },
  renderOriginItem(o) {
    const chip = this.colorChip(o.colors || []);
    const bonuses = (o.statBonuses || []).map(b => `+${b.bonus} ${b.skill}`).join(', ');
    return `<div class="item">
      <div class="item-name">${chip}<strong>${this.escape(o.name)}</strong>${bonuses ? `<span class="chip tier">${bonuses}</span>` : ''}</div>
      ${o.feature ? `<div class="item-meta">${this.escape(o.feature)}</div>` : ''}
      ${o.description ? `<div class="item-desc">${this.escape(o.description)}</div>` : ''}
    </div>`;
  },
  renderEquipmentItem(e) {
    const meta = [
      e.category, e.subcategory,
      e.damage ? `DMG ${e.damage}` : null,
      e.ac ? `AC ${e.ac}` : null,
      e.range ? `Rng ${e.range}` : null,
      e.durability ? `Dur ${e.durability}` : null,
      e.costMonnies != null ? `${e.costMonnies} monies` : null
    ].filter(Boolean).map(x => `<span class="chip tier">${this.escape(x)}</span>`).join(' ');
    const mb = e.magicBonded ? `<span class="chip purple">Magic-Bonded</span>` : '';
    return `<div class="item">
      <div class="item-name">${mb}<strong>${this.escape(e.name)}</strong></div>
      <div class="item-meta">${meta}</div>
      ${e.description ? `<div class="item-desc">${this.escape(e.description)}</div>` : ''}
    </div>`;
  },
  renderBasicActionItem(a) {
    return `<div class="item">
      <div class="item-name"><strong>${this.escape(a.name)}</strong>${a.cost ? `<span class="chip tier">${this.escape(a.cost)}</span>` : ''}</div>
      ${a.description ? `<div class="item-desc">${this.escape(a.description)}</div>` : ''}
    </div>`;
  },
  renderKeywordItem(k) {
    return `<div class="item">
      <div class="item-name"><strong>${this.escape(k.term)}</strong><span class="chip tier">${this.escape(k.category)}</span></div>
      ${k.definition ? `<div class="item-desc">${this.escape(k.definition)}</div>` : ''}
    </div>`;
  },

  colorChip(colors) {
    if (!colors || !colors.length) return '';
    colors = colors.filter(Boolean);
    if (colors.length === 0) return '';
    if (colors.length === 1) {
      return `<span class="chip ${colors[0].toLowerCase()}">${colors[0]}</span>`;
    }
    return `<span class="chip split" style="--_a:var(--${colors[0].toLowerCase()}); --_b:var(--${colors[1].toLowerCase()})">${colors.slice(0,2).join(' / ')}</span>`;
  },

  // ---------- spells ----------
  renderSpells() {
    const el = document.getElementById('screen-spells');
    const c = this.active();
    if (!c) { el.innerHTML = '<p class="hint">No active character.</p>'; return; }
    c.spellsKnown = c.spellsKnown || [];
    const editingId = this._editingSpellId || null;
    const cards = c.spellsKnown.map(s => this.renderSpellCard(s, editingId === s.id)).join('');
    const emptyState = c.spellsKnown.length ? '' : `<div class="spell-empty">No spells yet. Tap <strong>+</strong> to build one.</div>`;
    el.innerHTML = `
      <div class="spells-header-row">
        <h1>Spells</h1>
        <div class="spells-header-actions">
          <button class="icon-btn" onclick="app.openSpellTablesModal()" title="Spell Tables" aria-label="Spell Tables">📖</button>
          <button class="icon-btn" onclick="app.addSpell()" title="New Spell" aria-label="New Spell">+</button>
        </div>
      </div>
      <p style="color:var(--text-dim); font-size:12px; margin:-4px 0 14px;">
        Spell cost is the <strong>DC</strong> you roll Spellcraft against. Failing adds (DC \u2212 roll) to your COAL.
      </p>
      <div class="spell-list">
        ${cards}
        ${emptyState}
      </div>
    `;
    // After injecting HTML, wire up delegated clicks for param-opt chips.
    // requestAnimationFrame so the HTML is live before we querySelectorAll.
    requestAnimationFrame(() => this._bindSpellEditorEvents());
  },
  _bindSpellEditorEvents() {
    const root = document.getElementById('screen-spells');
    if (!root) return;
    root.querySelectorAll('.param-opt[data-spell-id]').forEach(el => {
      if (el._wired) return;
      el._wired = true;
      const handler = (ev) => {
        ev.preventDefault();
        const sid = el.getAttribute('data-spell-id');
        const cid = el.getAttribute('data-cat-id');
        const pname = el.getAttribute('data-param-name');
        const oi = parseInt(el.getAttribute('data-opt-idx'), 10);
        this.toggleSpellParam(sid, cid, pname, oi);
      };
      el.addEventListener('click', handler);
      el.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') handler(ev);
      });
    });
    root.querySelectorAll('[data-cast-spell]').forEach(el => {
      if (el._wired) return;
      el._wired = true;
      el.addEventListener('click', (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        const sid = el.getAttribute('data-cast-spell');
        this.castSpell(sid);
      });
    });
    root.querySelectorAll('[data-delete-spell]').forEach(el => {
      if (el._wired) return;
      el._wired = true;
      el.addEventListener('click', (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        const sid = el.getAttribute('data-delete-spell');
        this.deleteSpell(sid);
      });
    });
    // Outside-tap-to-close for the spell editor. Rebind every render so
    // we always have exactly one handler attached while the editor is open.
    if (this._spellOutsideHandler) {
      document.removeEventListener('click', this._spellOutsideHandler, true);
      this._spellOutsideHandler = null;
    }
    const editing = root.querySelector('.spell-card.editing');
    if (editing && this._editingSpellId) {
      const handler = (ev) => {
        const t = ev.target;
        if (!t || !(t instanceof Element)) return;
        // Ignore clicks on modal/overlay, toasts, bottom nav, or things
        // the user clearly expects to stay-in-editor for.
        if (t.closest('.spell-card.editing')) return;
        if (t.closest('.modal-overlay')) return;
        if (t.closest('.settings-overlay')) return;
        if (t.closest('.toast')) return;
        if (t.closest('[data-cast-spell]')) return;
        if (t.closest('[data-delete-spell]')) return;
        // Click anywhere else = auto-save (already persisted) + close.
        this.closeSpellEditor();
      };
      this._spellOutsideHandler = handler;
      // Defer attach so the click that opened the editor doesn't also
      // close it. Use capture so we beat inline onclick handlers on the
      // spell list (e.g., tapping another collapsed card).
      requestAnimationFrame(() => {
        if (this._spellOutsideHandler === handler) {
          document.addEventListener('click', handler, true);
        }
      });
    }
  },
  renderSpellCard(s, expanded) {
    const dc = this.computeSpellDC(s);
    const picks = (s.picks || []).length;
    const canCast = picks > 0;
    const dcChip = expanded
      ? `<span class="spell-card-dc">DC ${dc}</span>`
      : (canCast
          ? `<button class="spell-card-cast" data-cast-spell="${s.id}" title="Cast (roll Spellcraft vs DC ${dc})" aria-label="Cast spell"><span class="dice-ico" aria-hidden="true">🎲</span><span>DC ${dc}</span></button>`
          : `<span class="spell-card-dc">DC ${dc}</span>`);
    const summaryHtml = this._renderSpellSummary(s);
    const head = `<div class="spell-card-head">
      <div class="spell-card-name">${this.escape(s.name || '(unnamed spell)')}</div>
      ${dcChip}
    </div>`;
    if (!expanded) {
      return `<div class="spell-card" onclick="app.editSpell('${s.id}')">${head}${summaryHtml}</div>`;
    }
    return `<div class="spell-card editing">${head}${summaryHtml}${this.renderSpellEditor(s, dc)}</div>`;
  },
  _renderSpellSummary(s) {
    const picks = s.picks || [];
    if (picks.length === 0) {
      return `<div class="spell-card-meta empty">Tap to build this spell.</div>`;
    }
    const cats = (typeof SPELL_DATA !== 'undefined' && SPELL_DATA.categories) || [];
    // Params that _composeSpellSentence already folds into prose per category.
    // Picks for any other paramName still get a chip next to the sentence.
    const SENTENCE_PARAMS = {
      'damage':        ['Damage','Damage Type','Targets','Target Type','Range','Duration','Resist DC','AC Increase'],
      'healing':       ['Health','Number of Heals','Targets','Target Type','Range','Duration'],
      'buff':          ['Roll Bonus','Number of Stats','Targets','Target Type','Range','Duration'],
      'damage-boost':  ['Damage Boost','Damage Type','Targets','Target Type','Range','Duration'],
      'guard':         ['Guard','Targets','Target Type','Range','Duration'],
      'health-resist': ['Health Resistance','Targets','Target Type','Range','Duration','Resist DC'],
      'movement':      ['Movement','Targets','Target Type','Range','Duration','Resist DC'],
      'transform':     ['Transform','Target','Size','Number','Range','Duration','Resist DC'],
    };
    const byCat = new Map();
    for (const p of picks) {
      if (!byCat.has(p.catId)) byCat.set(p.catId, []);
      byCat.get(p.catId).push(p);
    }
    let sentence = '';
    let coveredParams = null;
    if (byCat.size === 1) {
      const catId = [...byCat.keys()][0];
      const cat = cats.find(c => c.id === catId);
      if (cat) {
        const lookup = this._spellPickLookup(cat, byCat.get(catId));
        sentence = this._composeSpellSentence(catId, lookup);
        if (sentence) coveredParams = new Set(SENTENCE_PARAMS[catId] || []);
      }
    }
    const groups = [];
    for (const [catId, catPicks] of byCat) {
      const cat = cats.find(c => c.id === catId);
      if (!cat) continue;
      const chips = [];
      for (const pk of catPicks) {
        if (coveredParams && coveredParams.has(pk.paramName)) continue;
        const param = (cat.parameters || []).find(pp => pp.name === pk.paramName);
        if (!param) continue;
        const opt = (param.options || [])[pk.optIdx];
        if (!opt) continue;
        const label = `${this.escape(param.name)}: ${this.escape(opt.label ?? '\u2014')}`;
        const tipParts = [];
        if (opt.cost != null) tipParts.push(`Cost +${opt.cost}`);
        if (opt.die) tipParts.push(`Die ${opt.die}`);
        const tipAttr = tipParts.length ? ` title="${this.escape(tipParts.join(' \u00b7 '))}"` : '';
        chips.push(`<span class="summary-chip"${tipAttr}>${label}</span>`);
      }
      if (chips.length === 0) continue;
      const catLabel = byCat.size > 1 ? `<span class="summary-cat">${this.escape(cat.name)}</span>` : '';
      groups.push(`<div class="summary-group">${catLabel}${chips.join('')}</div>`);
    }
    const chipBlock = groups.length ? `<div class="spell-summary">${groups.join('')}</div>` : '';
    if (sentence) {
      return `<div class="spell-sentence">${this.escape(sentence)}</div>${chipBlock}`;
    }
    return chipBlock || `<div class="spell-card-meta empty">Tap to build this spell.</div>`;
  },
  _spellPickLookup(cat, picks) {
    // Returns a map of { paramName: { label, die, cost, raw: opt } } for easy access.
    const out = {};
    for (const pk of picks) {
      const param = (cat.parameters || []).find(pp => pp.name === pk.paramName);
      if (!param) continue;
      const opt = (param.options || [])[pk.optIdx];
      if (!opt) continue;
      out[param.name] = { label: opt.label ?? '', die: opt.die || '', cost: opt.cost, raw: opt };
    }
    return out;
  },
  _composeSpellSentence(catId, L) {
    // Helpers for common clauses
    const targetClause = (tCountKey='Targets', tTypeKey='Target Type') => {
      const count = L[tCountKey]?.label;
      const type = L[tTypeKey]?.label;
      if (count && type) {
        // If type is a radius, phrase differently.
        if (/radius/i.test(type)) return `${count} targets in a ${type.toLowerCase()}`;
        // Creature / Weapon / Spell etc.
        const unit = type.toLowerCase();
        const n = parseInt(count, 10);
        const plural = (!isNaN(n) && n > 1) ? `s` : '';
        return `${count} ${unit}${plural}`;
      }
      if (count) return `${count} target${count === '1' ? '' : 's'}`;
      if (type) return /radius/i.test(type) ? `targets in a ${type.toLowerCase()}` : type.toLowerCase();
      return '';
    };
    const rangeClause = () => {
      const r = L['Range']?.label;
      if (!r) return '';
      // The options are already phrased as "Close <20ft" etc. Strip the leading label words.
      // "Close <20ft" -> "within 20ft", "Medium <40ft" -> "within 40ft", "Touch" -> "by touch",
      // "Very far = that you can see" -> "that you can see", "Global = A creature that you know of" -> "a creature you know of".
      const s = String(r).trim();
      if (/^touch$/i.test(s)) return 'by touch';
      const m1 = s.match(/<\s*(\d+\s*ft)/i);
      if (m1) return `within ${m1[1].replace(/\s+/g, '')}`;
      const m2 = s.match(/=\s*(.+)$/);
      if (m2) return m2[1].trim().toLowerCase().replace(/^a\s+/, 'a ');
      return s.toLowerCase();
    };
    const durationClause = () => {
      const d = L['Duration']?.label;
      if (!d) return '';
      const s = String(d).trim();
      // Normalize a few known patterns.
      if (/^over 2 turns$/i.test(s)) return 'over 2 turns';
      if (/^once \(instant\)$/i.test(s)) return 'once';
      if (/^twice \(instant\)$/i.test(s)) return 'twice';
      if (/^twice \(delayed\)$/i.test(s)) return 'twice (delayed)';
      if (/^end of turn$/i.test(s)) return 'until end of turn';
      if (/^end of round$/i.test(s)) return 'until end of round';
      if (/^end of next round$/i.test(s)) return 'until end of next round';
      if (/^end after two rounds$/i.test(s)) return 'for 2 rounds';
      if (/^end after three rounds$/i.test(s)) return 'for 3 rounds';
      return s.toLowerCase();
    };
    const resistClause = () => {
      const r = L['Resist DC']?.label;
      if (!r) return '';
      // "Moderate (9)" -> "resist DC 9"
      const m = String(r).match(/\((\d+)\)/);
      if (m) return `resist DC ${m[1]}`;
      return String(r).toLowerCase();
    };
    const damageTypeClause = () => {
      const dt = L['Damage Type']?.label;
      return dt ? String(dt).toLowerCase() : '';
    };
    const join = (parts) => parts.filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
    const cap = (str) => str ? str.charAt(0).toUpperCase() + str.slice(1) : str;
    switch (catId) {
      case 'damage': {
        const dmg = L['Damage']?.label;
        const die = L['Damage']?.die;
        const dtype = damageTypeClause();
        const target = targetClause();
        const range = rangeClause();
        const dur = durationClause();
        const resist = resistClause();
        const ac = L['AC Increase']?.label;
        // e.g. "Deal d8 (Damage) fire to 1 creature within 20ft; resist DC 9."
        const dmgPart = dmg ? (die ? `${die} (${dmg})` : dmg) : '';
        const toClause = target ? `to ${target}` : '';
        const pieces = ['Deal', dmgPart, dtype, toClause, range, dur && `(${dur})`].filter(Boolean);
        let out = join(pieces);
        const tail = [resist, ac && `AC ${ac}`].filter(Boolean).join('; ');
        if (tail) out += `; ${tail}`;
        return out ? cap(out + '.') : '';
      }
      case 'healing': {
        const heal = L['Health']?.label;
        const die = L['Health']?.die;
        const numHeals = L['Number of Heals']?.label;
        const target = targetClause();
        const range = rangeClause();
        const dur = durationClause();
        const healPart = heal ? (die ? `${die} (${heal})` : heal) : '';
        const repeat = numHeals && numHeals !== '1' ? `${numHeals}\u00d7` : '';
        const toClause = target ? `to ${target}` : '';
        const pieces = ['Heal', repeat, healPart, toClause, range, dur && `(${dur})`];
        const out = join(pieces);
        return out ? cap(out + '.') : '';
      }
      case 'buff': {
        const bonus = L['Roll Bonus']?.label;
        const stats = L['Number of Stats']?.label;
        const target = targetClause();
        const range = rangeClause();
        const dur = durationClause();
        const bonusPart = bonus ? bonus.replace(/^add\s+/i, '+').replace(/^(\d)/, '+$1') : '';
        const statsPart = stats ? `to ${stats} stat${stats === '1' ? '' : 's'}` : '';
        const ofClause = target ? `of ${target}` : '';
        const pieces = [bonusPart, statsPart, ofClause, range, dur && `(${dur})`];
        const out = join(pieces);
        return out ? cap(out + '.') : '';
      }
      case 'damage-boost': {
        const dmg = L['Damage Boost']?.label;
        const die = L['Damage Boost']?.die;
        const dtype = damageTypeClause();
        const target = targetClause();
        const range = rangeClause();
        const dur = durationClause();
        const dmgPart = dmg ? (die ? `${die} (${dmg})` : dmg) : '';
        const toClause = target ? `to ${target}` : '';
        const pieces = ['Add', dmgPart, dtype, 'damage', toClause, range, dur && `(${dur})`];
        const out = join(pieces);
        return out ? cap(out + '.') : '';
      }
      case 'guard': {
        const g = L['Guard']?.label;
        const target = targetClause();
        const range = rangeClause();
        const dur = durationClause();
        const toClause = target ? `to ${target}` : '';
        const pieces = ['Grant', g && `${g} guard`, toClause, range, dur && `(${dur})`];
        const out = join(pieces);
        return out ? cap(out + '.') : '';
      }
      case 'health-resist': {
        const eff = L['Health Resistance']?.label;
        const target = targetClause();
        const range = rangeClause();
        const dur = durationClause();
        const resist = resistClause();
        let effText = '';
        if (eff) {
          if (/^add\s+\d/i.test(eff)) effText = eff.replace(/^add\s+/i, '+') + ' to health resistance';
          else if (/^subtract\s+\d/i.test(eff)) effText = eff.replace(/^subtract\s+/i, '\u2212') + ' to health resistance';
          else if (/die size/i.test(eff)) effText = `shift health-resistance die by ${eff.toLowerCase()}`;
          else effText = eff.toLowerCase();
        }
        const toClause = target ? `to ${target}` : '';
        const pieces = [effText, toClause, range, dur && `(${dur})`];
        let out = join(pieces);
        if (resist) out += `; ${resist}`;
        return out ? cap(out + '.') : '';
      }
      case 'movement': {
        const mv = L['Movement']?.label;
        const target = targetClause();
        const range = rangeClause();
        const dur = durationClause();
        const resist = resistClause();
        let mvText = '';
        if (mv) {
          if (/^add\s+\d/i.test(mv)) mvText = mv.replace(/^add\s+/i, '+') + ' movement';
          else if (/^subtract\s+\d/i.test(mv)) mvText = mv.replace(/^subtract\s+/i, '\u2212') + ' movement';
          else mvText = mv.toLowerCase();
        }
        const toClause = target ? `to ${target}` : '';
        const pieces = [mvText, toClause, range, dur && `(${dur})`];
        let out = join(pieces);
        if (resist) out += `; ${resist}`;
        return out ? cap(out + '.') : '';
      }
      case 'transform': {
        const act = L['Transform']?.label;
        const tgt = L['Target']?.label;
        const size = L['Size']?.label;
        const num = L['Number']?.label;
        const range = rangeClause();
        const dur = durationClause();
        const resist = resistClause();
        // Strip parentheticals from Transform label (they're long descriptions).
        const actShort = act ? act.replace(/\s*\(.*?\)\s*$/, '') : '';
        const countSize = [num, size, tgt].filter(Boolean).join(' ');
        const pieces = [actShort, countSize && `${countSize} target${num === '1' ? '' : 's'}`, range, dur && `(${dur})`];
        let out = join(pieces);
        if (resist) out += `; ${resist}`;
        return out ? cap(out + '.') : '';
      }
      default:
        return '';
    }
  },
  renderSpellEditor(s, dc) {
    const activeCatIds = new Set((s.picks || []).map(p => p.catId));
    // Default "current category" focus: first picked, or first non-placeholder if none
    const cats = (SPELL_DATA.categories || []).filter(cat => (cat.parameters || []).length > 0);
    const focusCat = this._spellFocusCat || (activeCatIds.size ? [...activeCatIds][0] : (cats[0] && cats[0].id));
    const lockedCatId = activeCatIds.size ? [...activeCatIds][0] : null;
    const visibleCats = lockedCatId ? cats.filter(cat => cat.id === lockedCatId) : cats;
    const catChips = visibleCats.map(cat => {
      const isActive = cat.id === focusCat;
      const hasPicks = activeCatIds.has(cat.id);
      const cls = 'cat-chip' + (isActive ? ' active' : '') + (hasPicks && !isActive ? ' has-picks' : '');
      const marker = hasPicks ? ' \u2022' : '';
      return `<span class="${cls}" onclick="app.focusSpellCat('${s.id}', '${cat.id}')">${this.escape(cat.name)}${marker}</span>`;
    }).join('');
    const lockHelp = lockedCatId
      ? `<span class="cat-lock-help"><a class="cat-clear-link" onclick="app.clearSpellPicks('${s.id}')">Clear picks</a> to switch Spell Tables</span>`
      : '';
    const cat = cats.find(c => c.id === focusCat) || cats[0];
    const paramGroups = (cat.parameters || []).map(p => {
      const opts = (p.options || []).map((o, oi) => {
        const isSel = (s.picks || []).some(pk => pk.catId === cat.id && pk.paramName === p.name && pk.optIdx === oi);
        const label = this.escape(o.label ?? '—');
        const die = o.die ? ` <span style="color:var(--text-dim);">(${this.escape(o.die)})</span>` : '';
        const tipParts = [];
        if (o.cost != null) tipParts.push(`Cost: +${o.cost}`);
        if (o.die) tipParts.push(`Die: ${o.die}`);
        const tip = tipParts.join(' · ');
        const tipAttr = tip ? ` title="${this.escape(tip)}"` : '';
        return `<span class="param-opt${isSel ? ' selected' : ''}" role="button" tabindex="0" data-spell-id="${s.id}" data-cat-id="${cat.id}" data-param-name="${this.escape(p.name)}" data-opt-idx="${oi}"${tipAttr}>${label}${die}</span>`;
      }).join('');
      return `<div class="param-group">
        <h5>${this.escape(p.name)}</h5>
        <div class="param-options">${opts}</div>
      </div>`;
    }).join('');
    return `<div class="spell-editor">
      <div class="input-row" style="margin-top:10px;">
        <label>Name</label>
        <input type="text" value="${this.escape(s.name || '')}" oninput="app.updateSpellName('${s.id}', this.value)" placeholder="Spell name (e.g., Scorching Bolt)">
      </div>
      <div class="spell-editor-dc">
        <div><div class="dc-label">Spell DC</div><div class="dc-value">${dc}</div></div>
        <div class="dc-desc">Fail this check and gain<br>(DC \u2212 roll) COAL.</div>
      </div>
      <div class="cat-picker-row"><div class="cat-picker">${catChips}</div>${lockHelp}</div>
      ${paramGroups || '<div class="hint">No parameters for this category.</div>'}
      <div class="spell-editor-actions">
        <div class="spell-editor-actions-primary">
          <button class="primary" onclick="app.castSpell('${s.id}')">🎲 Cast (roll Spellcraft)</button>
          <button onclick="app.closeSpellEditor()" title="Changes save automatically — tap outside to close too">Close</button>
        </div>
        <button class="delete-btn${this._spellDeleteArmed === s.id ? ' armed' : ''}" data-delete-spell="${s.id}" title="Delete spell" aria-label="Delete spell">${this._spellDeleteArmed === s.id ? 'Tap to confirm' : '🗑'}</button>
      </div>
    </div>`;
  },
  // ---------- spell data ops ----------
  addSpell() {
    const c = this.active();
    c.spellsKnown = c.spellsKnown || [];
    const id = 'spell_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    c.spellsKnown.push({ id, name: '', picks: [] });
    this._editingSpellId = id;
    this._spellFocusCat = null;
    this.save();
    this.renderSpells();
  },
  editSpell(id) {
    this._editingSpellId = id;
    this._spellFocusCat = null;
    this.renderSpells();
  },
  closeSpellEditor() {
    this._editingSpellId = null;
    this._spellFocusCat = null;
    this._spellDeleteArmed = null;
    if (this._spellDeleteTimer) { clearTimeout(this._spellDeleteTimer); this._spellDeleteTimer = null; }
    if (this._spellOutsideHandler) {
      document.removeEventListener('click', this._spellOutsideHandler, true);
      this._spellOutsideHandler = null;
    }
    this.renderSpells();
  },
  deleteSpell(id) {
    // Two-tap arm: first tap highlights the button; second tap (within 3s)
    // actually deletes. Protects against accidental mobile taps.
    if (this._spellDeleteArmed === id) {
      // Second tap: delete for real.
      if (this._spellDeleteTimer) { clearTimeout(this._spellDeleteTimer); this._spellDeleteTimer = null; }
      this._spellDeleteArmed = null;
      const c = this.active();
      if (!c.spellsKnown) return;
      c.spellsKnown = c.spellsKnown.filter(s => s.id !== id);
      this._editingSpellId = null;
      this.save();
      this.renderSpells();
      this.toast('Spell deleted.');
      return;
    }
    // First tap: arm, and auto-disarm after 3s.
    this._spellDeleteArmed = id;
    if (this._spellDeleteTimer) clearTimeout(this._spellDeleteTimer);
    this._spellDeleteTimer = setTimeout(() => {
      if (this._spellDeleteArmed === id) {
        this._spellDeleteArmed = null;
        this.renderSpells();
      }
    }, 3000);
    this.renderSpells();
  },
  updateSpellName(id, value) {
    const c = this.active();
    const s = (c.spellsKnown || []).find(x => x.id === id);
    if (!s) return;
    s.name = value;
    this.save();
    // Don't re-render here - would lose focus on input
  },
  focusSpellCat(id, catId) {
    const c = this.active();
    const s = (c.spellsKnown || []).find(x => x.id === id);
    if (s && (s.picks || []).length > 0) {
      const lockedCatId = s.picks[0].catId;
      if (catId !== lockedCatId) {
        const lockedCat = (SPELL_DATA.categories || []).find(cc => cc.id === lockedCatId);
        const name = lockedCat ? lockedCat.name : 'another category';
        this.toast(`This spell already has picks in ${name}.`, {
          actionLabel: 'Clear picks',
          onAction: () => this.clearSpellPicks(id),
        });
        this._spellFocusCat = lockedCatId;
        this.renderSpells();
        return;
      }
    }
    this._spellFocusCat = catId;
    this.renderSpells();
  },
  clearSpellPicks(id) {
    const c = this.active();
    const s = (c.spellsKnown || []).find(x => x.id === id);
    if (!s || !(s.picks || []).length) return;
    s.picks = [];
    this._spellFocusCat = null;
    this.save();
    this.renderSpells();
    this.toast('Picks cleared. Pick a new category.');
  },
  toggleSpellParam(id, catId, paramName, optIdx) {
    const c = this.active();
    const s = (c.spellsKnown || []).find(x => x.id === id);
    if (!s) return;
    s.picks = s.picks || [];
    // If the same param already has a pick in this category, replace it (radio behavior per param)
    const existingIdx = s.picks.findIndex(p => p.catId === catId && p.paramName === paramName);
    if (existingIdx >= 0 && s.picks[existingIdx].optIdx === optIdx) {
      // Toggle off
      s.picks.splice(existingIdx, 1);
    } else if (existingIdx >= 0) {
      s.picks[existingIdx].optIdx = optIdx;
    } else {
      s.picks.push({ catId, paramName, optIdx });
    }
    this.save();
    this.renderSpells();
  },
  computeSpellDC(s) {
    if (!s || !s.picks) return 0;
    let total = 0;
    for (const p of s.picks) {
      const cat = (SPELL_DATA.categories || []).find(c => c.id === p.catId);
      if (!cat) continue;
      const param = (cat.parameters || []).find(pp => pp.name === p.paramName);
      if (!param) continue;
      const opt = (param.options || [])[p.optIdx];
      if (opt && typeof opt.cost === 'number') total += opt.cost;
    }
    return total;
  },
  // ---------- spell tables reference modal ----------
  openSpellTablesModal() {
    const cats = (SPELL_DATA.categories || []).filter(c => (c.parameters || []).length > 0);
    const html = cats.map(cat => {
      const params = (cat.parameters || []).map(p => {
        const rows = (p.options || []).map(o =>
          `<tr><td>${this.escape(o.label ?? '—')}</td>${o.die ? `<td>${this.escape(o.die)}</td>` : '<td></td>'}<td class="cost">${o.cost != null ? o.cost : '—'}</td></tr>`
        ).join('');
        return `<div class="param-block">
          <h5>${this.escape(p.name)}</h5>
          <table class="cost-table">
            <tr><th>Option</th><th>Die</th><th class="cost">Cost</th></tr>
            ${rows}
          </table>
        </div>`;
      }).join('');
      return `<details class="spell-cat" style="margin-bottom:10px;">
        <summary><div><div class="cat-title">${this.escape(cat.name)}</div>${cat.description ? `<div class="cat-meta">${this.escape(cat.description)}</div>` : ''}</div></summary>
        ${params}
      </details>`;
    }).join('');
    this.showModal({
      title: 'Spell Cost Tables',
      body: `<div style="max-height:60vh; overflow-y:auto;">${html}</div>`,
      actions: [{ label: 'Close', class: 'primary', fn: () => this.closeModal() }]
    });
  },
  // ---------- cast flow ----------
  castSpell(id) {
    const c = this.active();
    const s = (c.spellsKnown || []).find(x => x.id === id);
    if (!s) return;
    const dc = this.computeSpellDC(s);
    if (dc === 0) {
      this.toast('Pick at least one parameter first.');
      return;
    }
    const sc = (c.skills && c.skills.magic && c.skills.magic.spellcraft) || {};
    const baseDie = sc.die || (c.skills && c.skills.magic && c.skills.magic.reserve && c.skills.magic.reserve.die) || 'd6';
    const bonusStr = (sc.bonus || '').trim();
    const bonusNum = this._parseSpellcraftBonus(bonusStr);
    const reserve = (c.skills && c.skills.magic && c.skills.magic.reserve) || { max: 0, current: 0, die: 'd6' };
    const maxReserve = Math.max(0, reserve.current || 0);
    const reserveDie = reserve.die || 'd6';
    this._spellCastState = { id, dc, baseDie, bonusNum, bonusStr, reserveDie, maxReserve, useReserves: 0 };
    this.renderCastModal();
  },
  _parseSpellcraftBonus(s) {
    // Delegates to general bonus parser.
    return this._parseBonusSum(s);
  },
  _parseBonusSum(s) {
    // Sum signed integers that appear as magnitudes in a bonus string, ignoring
    // numbers inside parenthetical context (e.g. "+1 (Potential), +2 (Level 6)" -> 3).
    if (!s) return 0;
    const stripped = String(s).replace(/\([^)]*\)/g, ' ');
    const matches = stripped.match(/[+-]?\s*\d+/g) || [];
    let total = 0;
    for (const m of matches) {
      const n = parseInt(m.replace(/\s+/g, ''), 10);
      if (!isNaN(n)) total += n;
    }
    return total;
  },
  renderCastModal() {
    const st = this._spellCastState;
    if (!st) return;
    const c = this.active();
    const s = (c.spellsKnown || []).find(x => x.id === st.id);
    const bonusTxt = st.bonusNum ? ` + ${st.bonusNum}` : '';
    const reservePart = st.useReserves > 0 ? ` + ${st.useReserves}\u00d7${st.reserveDie}` : '';
    this.showModal({
      title: `Cast: ${this.escape(s.name || '(unnamed)')} \u2014 DC ${st.dc}`,
      body: `
        <p>Roll <strong>${st.baseDie}${bonusTxt}${reservePart}</strong> against <strong>DC ${st.dc}</strong>.</p>
        <p style="font-size:12px; color:var(--text-dim); margin:4px 0;">Spellcraft base: ${st.baseDie}${st.bonusStr ? ' \u00b7 bonus: ' + this.escape(st.bonusStr) : ''}</p>
        <div style="margin:14px 0 8px;">
          <div class="reserve-selector">
            <span style="font-size:12px;">Reserve dice to spend:</span>
            <button onclick="app.adjustCastReserves(-1)">\u2212</button>
            <span class="reserve-count">${st.useReserves}</span>
            <button onclick="app.adjustCastReserves(1)">+</button>
            <span style="font-size:11px; color:var(--text-dim);">(${st.maxReserve} available)</span>
          </div>
        </div>
      `,
      actions: [
        { label: 'Cancel', class: '', fn: () => { this._spellCastState = null; this.closeModal(); } },
        { label: 'Roll!', class: 'primary', fn: () => this.executeCastRoll() }
      ]
    });
  },
  adjustCastReserves(delta) {
    const st = this._spellCastState;
    if (!st) return;
    st.useReserves = Math.max(0, Math.min(st.maxReserve, st.useReserves + delta));
    this.renderCastModal();
  },
  executeCastRoll() {
    const st = this._spellCastState;
    if (!st) return;
    const c = this.active();
    const baseSides = DICE.parseDie(st.baseDie) || 6;
    const baseRoll = DICE.rollDie(baseSides);
    const reserveSides = DICE.parseDie(st.reserveDie) || 6;
    const reserveRolls = [];
    for (let i = 0; i < st.useReserves; i++) reserveRolls.push(DICE.rollDie(reserveSides));
    const reserveSum = reserveRolls.reduce((a, b) => a + b, 0);
    const total = baseRoll + st.bonusNum + reserveSum;
    const pass = total >= st.dc;
    const delta = st.dc - total;
    // Spend reserves from the character
    if (st.useReserves > 0 && c.skills && c.skills.magic && c.skills.magic.reserve) {
      c.skills.magic.reserve.current = Math.max(0, (c.skills.magic.reserve.current || 0) - st.useReserves);
    }
    // Show result modal
    const reserveLine = st.useReserves > 0 ? `<div class="cast-roll-line"><span class="dice">Reserves (${st.useReserves}\u00d7${st.reserveDie}):</span> [${reserveRolls.join(', ')}] = +${reserveSum}</div>` : '';
    const bonusLine = st.bonusNum ? `<div class="cast-roll-line"><span class="dice">Bonus:</span> +${st.bonusNum}</div>` : '';
    const resultCls = pass ? 'cast-result-pass' : 'cast-result-fail';
    const resultText = pass
      ? `Success! (${total} \u2265 DC ${st.dc})`
      : `Failed by ${delta}. Would gain <strong>+${delta} COAL</strong>.`;
    const actions = pass
      ? [{ label: 'Nice', class: 'primary', fn: () => { this._spellCastState = null; this.save(); this.closeModal(); this.renderSpells(); } }]
      : [
          { label: 'Skip COAL', class: '', fn: () => { this._spellCastState = null; this.save(); this.closeModal(); this.renderSpells(); } },
          { label: `+${delta} COAL`, class: 'primary', fn: () => this.applyCoalFromFailedCast(delta) }
        ];
    this.showModal({
      title: `Roll: ${total}`,
      body: `
        <div class="cast-roll-line"><span class="dice">Base (${st.baseDie}):</span> ${baseRoll}</div>
        ${bonusLine}
        ${reserveLine}
        <div class="cast-roll-line" style="border-top:1px solid var(--border); padding-top:6px; margin-top:6px;"><span class="dice">Total:</span> <strong>${total}</strong> vs DC ${st.dc}</div>
        <div style="margin-top:12px; font-size:15px;" class="${resultCls}">${resultText}</div>
      `,
      actions
    });
  },
  applyCoalFromFailedCast(delta) {
    const c = this.active();
    c.vitals = c.vitals || {};
    c.vitals.coal = c.vitals.coal || { current: 0, max: 0 };
    c.vitals.coal.current = (c.vitals.coal.current || 0) + delta;
    this._spellCastState = null;
    this.save();
    this.closeModal();
    this.renderSpells();
    this.toast(`+${delta} COAL gained.`);
  },

  openSettings() {
    const el = document.getElementById('settings-overlay');

  },

    const el = document.getElementById('settings-overlay');
    if (!el) return;
    el.classList.remove('open');
  },
  handleSettingsBackdrop(ev) {
    if (ev.target && ev.target.id === 'settings-overlay') this.closeSettings();
  },

  setActive(id) {
    this.activeCharId = id;
    this.save();
    this.toast(`Switched to ${this.active().name}`);
    this.goto('sheet');
  },
  deleteCharacter(id) {
    const c = this.characters.find(x => x.id === id);
    if (!c) return;
    this.showModal({
      title: `Delete ${c.name || '(unnamed)'}?`,
      body: `This permanently removes this character from your device. Export first if you want to keep a copy.`,
      actions: [
        { label: 'Cancel', class: '', fn: () => this.closeModal() },
        { label: 'Delete', class: 'danger', fn: () => {
          const wasActive = this.activeCharId === id;
          this.characters = this.characters.filter(x => x.id !== id);
          if (wasActive) this.activeCharId = this.characters[0]?.id || null;
          this.save();
          this.closeModal();
          this.renderAll();
          this.renderSettings();
          this.toast(`Deleted ${c.name || 'character'}.`);
        }}
      ]
    });
  },

  // ---------- import/export ----------
  exportActive() {
    this.downloadJson(this.active(), `${this.active().name.replace(/\s+/g,'_')}.jasiri.json`);
  },
  exportAll() {
    this.downloadJson({ schemaVersion:1, characters: this.characters }, `jasiri_characters_${new Date().toISOString().slice(0,10)}.json`);
  },
  downloadJson(data, filename) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    this.toast(`Exported ${filename}`);
  },
  importCharacter() {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = () => {
      const file = inp.files[0]; if (!file) return;
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const data = JSON.parse(fr.result);
          const incoming = data.characters ? data.characters : [data];
          for (const c of incoming) {
            if (!c.name || !c.id) { this.toast('Import skipped: missing name or id'); continue; }
            // Avoid id collision: if same id exists, assign new one
            if (this.characters.find(x => x.id === c.id)) {
              c.id = c.id + '_' + Date.now();
            }
            this.characters.push(c);
          }
          this.save();
          this.toast(`Imported ${incoming.length} character(s)`);
          this.renderSettings();
        } catch (e) { this.toast('Import failed: ' + e.message); }
      };
      fr.readAsText(file);
    };
    inp.click();
  },
  resetDemos() {
    this.showModal({
      title: 'Reset to demos?',
      body: 'This will erase ALL characters (including custom edits) and restore the original 6 demo characters. Export first if you want to keep anything!',
      actions: [
        { label: 'Cancel', class: '', fn: () => this.closeModal() },
        { label: 'Reset', class: 'danger', fn: () => {
          this.characters = CHAR_DATA.characters.map(c => structuredClone(c));
          this.activeCharId = this.characters[0].id;
          this.save();
          this.closeModal();
          this.renderAll();
          this.toast('Reset to demos.');
        }}
      ]
    });
  },

  // ---------- misc interactions ----------
  toggleReservePip(treeId, idx) {
    const c = this.active();
    const r = c.skills[treeId].reserve;
    // Clicking a filled pip spends it; clicking an empty one restores it (fine for manual bookkeeping)
    if (idx < r.current) r.current = idx;     // spend down to this index
    else r.current = Math.min(r.max, idx + 1); // restore up to this pip
    this.save();
    this.renderSheet();
  },

  editCoal() {
    const c = this.active();
    const cur = c.vitals.coal.current;
    this.showModal({
      title: 'Adjust COAL',
      body: `<div class="input-row"><label>COAL</label><input type="text" id="coal-expr" value="${cur}" inputmode="text" autocomplete="off" autofocus></div>
             <div class="hint" style="margin-top:6px;">Tip: type an expression like <code>5+5</code>, <code>12-3</code>, or <code>2*4</code>.</div>`,
      actions: [
        { label: 'Cancel', class: '', fn: () => this.closeModal() },
        { label: 'Save', class: 'primary', fn: () => {
          const raw = (document.getElementById('coal-expr').value || '0').trim();
          const v = this.evalCoalExpr(raw);
          if (v === null) { this.toast('Invalid expression.'); return; }
          c.vitals.coal.current = Math.max(0, Math.floor(v));
          this.save(); this.closeModal(); this.renderSheet();
        }}
      ]
    });
  },
  evalCoalExpr(s) {
    // Accept digits, whitespace, + - * / ( ) . only.
    if (!/^[\d+\-*/().\s]+$/.test(s)) return null;
    try {
      const v = Function('"use strict"; return (' + s + ');')();
      return (typeof v === 'number' && isFinite(v)) ? v : null;
    } catch (e) { return null; }
  },
  toggleWound(which, idx) {
    // Tap pip N: if filled, count becomes N (unfill it + everything right).
    //            if empty, count becomes N+1 (fill it + everything left).
    const c = this.active();
    const cur = c.vitals.wounds[which];
    const next = (idx < cur) ? idx : idx + 1;

    if (which === 'minor') {
      c.vitals.wounds.minor = next;
      // Auto-convert 3 minors -> 1 major
      if (c.vitals.wounds.minor >= 3) {
        c.vitals.wounds.minor = 0;
        c.vitals.wounds.major += 1;
        this.toast('3 minor wounds → 1 Major Wound.');
      }
      if (c.vitals.wounds.minor === 0) c.vitals.wounds.restsUntilMinorHeals = 5;
    } else {
      c.vitals.wounds.major = Math.max(0, next);
    }
    this.save();
    this.renderSheet();
  },
  // Inline field editor. Replaces a span with an input that commits on Enter/blur,
  // cancels on Escape. Used for the character header (name, level, job, race, origin, player).
  editField(el, field, opts = {}) {
    if (!el || el.querySelector('input')) return;
    const c = this.active();
    if (!c) return;
    const current = c[field] ?? '';
    const width = Math.max(60, el.offsetWidth + 12);
    const isNum = opts.type === 'number';
    const input = document.createElement('input');
    input.type = isNum ? 'number' : 'text';
    input.value = current;
    input.className = 'inline-edit';
    input.style.width = width + 'px';
    if (isNum) { input.min = '0'; input.step = '1'; }
    const prev = el.innerHTML;
    el.innerHTML = '';
    el.appendChild(input);
    input.focus();
    input.select();
    let done = false;
    const commit = () => {
      if (done) return; done = true;
      let v = input.value.trim();
      if (isNum) {
        const n = parseInt(v, 10);
        v = Number.isFinite(n) ? n : (c[field] || 0);
      }
      c[field] = v;
      this.save();
      this.renderHeader();
      this.renderCharList && this.renderCharList();
    };
    const cancel = () => {
      if (done) return; done = true;
      el.innerHTML = prev;
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    });
    input.addEventListener('blur', commit);
  },

  // ---------- modal & toast ----------
  showModal({ title, body, actions }) {
    const box = document.getElementById('modal-box');
    // Sort so primary sits left/first, then danger, then neutral (Cancel/Close).
    // Stable sort preserves original order within the same priority bucket.
    const priority = (cls) => {
      const c = (cls || '').split(/\s+/);
      if (c.includes('primary')) return 0;
      if (c.includes('danger')) return 1;
      return 2;
    };
    const sortedActions = (actions || [])
      .map((a, i) => ({ a, i }))
      .sort((x, y) => (priority(x.a.class) - priority(y.a.class)) || (x.i - y.i))
      .map(({ a }) => a);
    const btns = sortedActions.map((a, i) =>
      `<button class="btn ${a.class || ''}" data-idx="${i}">${a.label}</button>`
    ).join('');
    box.innerHTML = `<h2>${title}</h2><div class="body">${body}</div><div class="actions">${btns}</div>`;
    const bd = document.getElementById('modal-backdrop');
    bd.classList.add('show');
    box.querySelectorAll('.actions .btn').forEach((btn, i) => {
      btn.onclick = sortedActions[i].fn;
    });
    bd.onclick = (e) => { if (e.target === bd) this.closeModal(); };
  },
  closeModal() { document.getElementById('modal-backdrop').classList.remove('show'); },

  toast(msg, opts) {
    const t = document.getElementById('toast');
    t.textContent = '';
    if (t._toastActionHandler) {
      t.removeEventListener('click', t._toastActionHandler);
      t._toastActionHandler = null;
    }
    const msgSpan = document.createElement('span');
    msgSpan.textContent = msg;
    t.appendChild(msgSpan);
    const hasAction = opts && opts.actionLabel && typeof opts.onAction === 'function';
    if (hasAction) {
      const btn = document.createElement('button');
      btn.className = 'toast-action';
      btn.type = 'button';
      btn.textContent = opts.actionLabel;
      const handler = (ev) => {
        if (ev.target !== btn) return;
        ev.stopPropagation();
        try { opts.onAction(); } finally {
          t.classList.remove('show');
        }
      };
      t.addEventListener('click', handler);
      t._toastActionHandler = handler;
      t.appendChild(btn);
    }
    t.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => {
      t.classList.remove('show');
      if (t._toastActionHandler) {
        t.removeEventListener('click', t._toastActionHandler);
        t._toastActionHandler = null;
      }
    }, hasAction ? 4500 : 2200);
  },

  escape(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
};

// ---------- self-test ----------
// Runs once on load; logs to console. Doesn't block UI.
function runSelfTest() {
  const results = [];
  const assert = (desc, cond) => results.push({ desc, pass: !!cond });

  // Dice sanity
  assert('rollDie(6) in [1,6]', (() => { for (let i=0;i<200;i++) { const v=DICE.rollDie(6); if (v<1||v>6) return false; } return true; })());
  assert('parseDie("d10")===10', DICE.parseDie('d10') === 10);
  const expr = DICE.rollExpression('2d6+3');
  assert('2d6+3 total range [5,15]', expr && expr.total >= 5 && expr.total <= 15 && expr.rolls.length === 2);

  // Wound math
  const fakeChar = { vitals:{ healthDice:[{dieSize:'d6',lost:false},{dieSize:'d4',lost:false}], wounds:{minor:0,major:0,restsUntilMinorHeals:5}, coal:{current:0,max:0} }, skills:{physical:{reserve:{max:2,current:0,die:'d6'}},intellectual:{reserve:{max:2,current:0,die:'d6'}},emotional:{reserve:{max:2,current:0,die:'d6'}},magic:{reserve:{max:2,current:0,die:'d6'}}} };
  assert('activeDieIndex with all alive = last index', app.activeDieIndex(fakeChar) === 1);
  fakeChar.vitals.healthDice[1].lost = true;
  assert('activeDieIndex skips lost', app.activeDieIndex(fakeChar) === 0);
  fakeChar.vitals.healthDice[0].lost = true;
  assert('activeDieIndex returns -1 when all lost', app.activeDieIndex(fakeChar) === -1);

  const passed = results.filter(r => r.pass).length;
  console.log(`%c[Jasiri self-test] ${passed}/${results.length} passed`, 'color:' + (passed === results.length ? '#6f6' : '#f66'));
  results.filter(r => !r.pass).forEach(r => console.error('FAIL:', r.desc));
}

// ---------- boot ----------
window.addEventListener('DOMContentLoaded', () => {
  app.init();
  runSelfTest();
});
</script>
